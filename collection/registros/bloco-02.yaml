perguntas:
  - ID: B2.06
    bloco: 2
    enunciado: >-
      Sem precisar abrir agora extratos ou faturas, você sabe
      aproximadamente quanto gastou no último mês?
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: Sim. Sei o valor com boa aproximação., valor_interno: BOA_APROXIMACAO}
      - rotulo: >-
          Tenho uma ideia razoável, mas não saberia dizer com muita
          segurança.
        valor_interno: RAZOAVEL
      - {rotulo: Tenho apenas uma noção geral., valor_interno: NOCAO_GERAL}
      - {rotulo: Não sei quanto gastei., valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: CONHECIMENTO_GASTO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

