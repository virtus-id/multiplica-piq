# Bloco 3 — Fluxo de caixa real. 57 perguntas, transcritas caractere por
# caractere da §11 da canônica (specs/piq-app-spec.md, linhas 1040-1899). T-17
# (RF-03, RF-04, RF-09, AC-04, AC-36).
QUESTIONARIO_VERSION: "1.2.0"
perguntas:
  # Parte A — Renda
  - ID: B3.01
    bloco: 3
    enunciado: >-
      Quanto você recebe por mês, em média, depois do imposto de renda e da
      previdência, mas antes de empréstimos e consignados? (Não desconte
      parcelas de empréstimo nem consignado: você cadastra essas dívidas mais
      adiante. Plano de saúde, sindicato e outros descontos de folha entram
      nas despesas.)
    tipo: MOEDA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - rotulo: >-
          Minha renda é variável e não consigo representá-la por um único
          valor.
        valor_interno: RENDA_VARIAVEL  # T-296
    VARIAVEL_GRAVADA: RENDA_PRINCIPAL
    indispensavel: true  # RF-93 (`T-261`, `R9-8`)
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      "Renda variável sem valor único" → RENDA_PRINCIPAL = DESCONHECIDA e
      B3.02 deve ser Variável.

  - ID: B3.02
    bloco: 3
