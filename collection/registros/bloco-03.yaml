    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - rotulo: >-
          Fixa — recebo praticamente o mesmo valor líquido todos os meses.
        valor_interno: FIXA
      - rotulo: >-
          Relativamente estável — o valor varia, mas normalmente dentro de
          uma faixa pequena.
        valor_interno: RELATIVAMENTE_ESTAVEL
      - rotulo: >-
          Variável — o valor pode mudar bastante de um mês para outro.
        valor_interno: VARIAVEL
    VARIAVEL_GRAVADA: TIPO_RENDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "VARIAVEL → abre B3.02A e B3.02B."

