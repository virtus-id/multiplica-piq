# Bloco 5 — Inventário de dívidas. 58 perguntas, transcritas caractere por
# caractere da §11 da canônica (specs/piq-app-spec.md, linhas 2618-3473). T-17
# (RF-03, RF-04, RF-09, AC-04, AC-36). 55 das 58 perguntas são REP por
# DIVIDA_ID (cada dívida é uma ficha) — só B5.00, B5.00A e B5.FIM02 não são
# repetíveis (são perguntas de caso, não de ficha de dívida).
QUESTIONARIO_VERSION: "1.5.0"
perguntas:
  - ID: B5.00
    bloco: 5
    enunciado: >-
      Quantas dívidas ou operações financeiras diferentes você tem hoje?
    tipo: NUMERO
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "___ dívida(s)", valor_interno: null}
      - {rotulo: Nenhuma dívida., valor_interno: "0"}
    VARIAVEL_GRAVADA: QUANTIDADE_DIVIDAS_DECLARADA_INICIAL
    faixa:
      minimo: 0
      maximo: 50
      mensagem: Informe a quantidade de dívidas, de 1 a 50, ou escolha "Nenhuma dívida".
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      A quantidade é exata: o cálculo exige uma ficha para cada dívida
      declarada. "Nenhuma dívida" não abre ficha e não gera plano.

  # Grupo A — Identificação (ficha REP por dívida)
  - ID: B5.A01
    bloco: 5
    enunciado: Para quem você deve nessa [ordinal] dívida?
    apresentacao: MENU
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Caixa Econômica Federal, valor_interno: Caixa Econômica Federal}
      - {rotulo: Banco do Brasil, valor_interno: Banco do Brasil}
      - {rotulo: Itaú, valor_interno: Itaú}
      - {rotulo: Bradesco, valor_interno: Bradesco}
      - {rotulo: Santander, valor_interno: Santander}
      - {rotulo: Nubank, valor_interno: Nubank}
      - {rotulo: Banco Inter, valor_interno: Banco Inter}
      - {rotulo: C6 Bank, valor_interno: C6 Bank}
      - {rotulo: Sicoob, valor_interno: Sicoob}
      - {rotulo: Sicredi, valor_interno: Sicredi}
      - rotulo: Outra instituição ou pessoa
        valor_interno: OUTRA
        abre_campo: TEXTO_CURTO
        variavel_do_campo: CREDOR_OUTRO
    VARIAVEL_GRAVADA: CREDOR
    condicao_exibicao: null
    interpolacoes:
      - {marcador: "[ordinal]", origem: ORDINAL_DO_ITEM, referencia: ""}
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  - ID: B5.A02
    bloco: 5
    enunciado: Que tipo de dívida é esta?
    tipo: SELECAO_UNICA
    apresentacao: MENU
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Empréstimo consignado, valor_interno: CONSIGNADO}
      - {rotulo: Empréstimo pessoal, valor_interno: PESSOAL}
      - {rotulo: Financiamento de veículo, valor_interno: FIN_VEICULO}
      - {rotulo: Financiamento imobiliário, valor_interno: FIN_IMOBILIARIO}
      - {rotulo: Cartão de crédito — saldo rotativo, valor_interno: CARTAO_ROTATIVO}
      - {rotulo: Cartão de crédito — parcelamento de fatura, valor_interno: CARTAO_PARCELADO}
      - {rotulo: Cheque especial, valor_interno: CHEQUE_ESPECIAL}
      - {rotulo: Parcelamento de compra, valor_interno: PARCELAMENTO_COMPRA}
      - {rotulo: Dívida tributária, valor_interno: TRIBUTARIA}
      - {rotulo: Dívida com familiar ou outra pessoa, valor_interno: PESSOA_FISICA}
      - {rotulo: Acordo ou renegociação, valor_interno: ACORDO}
      - {rotulo: Outra, valor_interno: OUTRA}
    VARIAVEL_GRAVADA: TIPO_DIVIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      Define modelo da engine, exibição de B5.C07 (linhas reutilizáveis) e
      de B5.G03 (modalidades portáveis).

  # `T-492` (RF-514, RF-523): a calculadora da dívida — pergunta composta, gravada
  # só pelo endpoint da calculadora (nunca por `POST /resposta`). Grava as MESMAS
  # variáveis das perguntas individuais (`B5.B03`, `B5.C02`, `B5.C02B`, `B5.D06`,
  # `B5.C02A`) e, por último, a marca `CONFERENCIA_DA_DIVIDA`. Enunciado
  # aceito como está pelo produto (`T-509`, 2026-11-06).
  - ID: B5.CALC01
    bloco: 5
    enunciado: >-
      Vamos conferir os números desta dívida: saldo devedor, parcela, taxa e
      prazo restante.
    apoio: >-
      Informe o que souber. Com três desses valores, calculamos o quarto.
    tipo: CALCULO_DIVIDA
    obrigatoriedade: [OPT, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes: []
    VARIAVEL_GRAVADA: CONFERENCIA_DA_DIVIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  # Grupo B — Valores e saldo
  - ID: B5.B03
    bloco: 5
    enunciado: Qual é o saldo devedor atual desta dívida?
    tipo: MOEDA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
    VARIAVEL_GRAVADA: SALDO_DEVEDOR_ATUAL
    indispensavel: true  # RF-93 (`T-261`, `R9-8`)
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true  # `T-493` (RF-523, AC-537): revoga `T-411`; nunca gravado como 0
    salto_consequencia: null

  # Grupo C — Fluxo
  - ID: B5.C02
    bloco: 5
    enunciado: Qual é o valor da parcela ou prestação que deveria ser paga atualmente?
    tipo: MOEDA
    obrigatoriedade: [OBR, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
    VARIAVEL_GRAVADA: "PARCELA_CONTRATUAL (= PAGAMENTO_MENSAL_DEVIDO_VIGENTE)"
    indispensavel: true  # RF-93 (`T-261`, `R9-8`)
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true  # `T-493` (RF-523, AC-537): nunca gravado como 0
    salto_consequencia: null

  # `T-492` (RF-514, RF-526): o prazo restante, em meses. Mesma variável que a
  # calculadora grava. `OPT`: caso antigo não tem a resposta e não trava por ela.
  - ID: B5.C02B
    bloco: 5
    enunciado: Quantos meses faltam para terminar de pagar esta dívida?
    tipo: NUMERO
    obrigatoriedade: [OPT, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "______ meses", valor_interno: null}
    VARIAVEL_GRAVADA: PRAZO_RESTANTE_MESES
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  # `T-525` (RF-533, OQ-85): o pagamento mínimo, ao lado do habitual (`B5.C02`).
  # `OPT`: caso antigo não tem a resposta e não trava por ela. Enunciado
  # aprovado (`T-532`).
  - ID: B5.C02C
    bloco: 5
    enunciado: "Qual é o pagamento mínimo que esta dívida exige por mês?"
    tipo: MOEDA
    obrigatoriedade: [OPT, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
    VARIAVEL_GRAVADA: PAGAMENTO_MINIMO_DIVIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true  # nunca gravado como 0
    salto_consequencia: null

  # `T-493` (RF-523; revoga `T-465`/RF-510): o sistema é perguntado em toda
  # dívida, sem condição. `OBR` (especialista, 2026-11-06), sem `indispensavel`:
  # o Price é o padrão que a calculadora pré-seleciona (`B5.CALC01`).
  - ID: B5.C02A
    bloco: 5
    enunciado: >-
      Esta dívida é pela tabela Price (parcelas fixas) ou pelo SAC (parcelas que
      diminuem a cada mês)? No SAC, a parcela informada acima deve ser a de
      hoje, que é a maior.
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "Price (parcelas fixas).", valor_interno: PRICE}
      - {rotulo: "SAC (parcelas que diminuem a cada mês).", valor_interno: SAC}
    VARIAVEL_GRAVADA: SISTEMA_AMORTIZACAO
    indispensavel: false  # especialista 2026-11-06: obrigatória, padrão Price (a montagem cai em Price)
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  # Grupo D — Custo
  # `T-393` (RF-407): um só valor de custo da dívida, CET ou taxa de juros,
  # sem marca de qual foi informado. Substitui `B5.D01`, `B5.D01A`, `B5.D01B`,
  # `B5.D03` e `B5.D03A`. Valor e periodicidade na mesma resposta: o código da
  # opção (ao mês / ao ano) vai em `PERIODICIDADE_TAXA_DIVIDA` e o percentual
  # digitado, em `TAXA_DIVIDA` (mecanismo `abre_campo` + `variavel_do_campo`).
  # `OBR` + `REP`: sem o valor, o cálculo não libera (`pendencias_obrigatorias`).
  - ID: B5.D06
    bloco: 5
    enunciado: >-
      Qual é o Custo Efetivo Total (CET) desta operação? Se não souber, informe
      a taxa de juros. (No seu contrato, extrato ou aplicativo do banco, esse
      número pode aparecer escrito como CET ou como taxa de juros. Informe o
      que encontrar e diga se é ao mês ou ao ano.)
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: ao mês, valor_interno: MENSAL, abre_campo: TAXA, variavel_do_campo: TAXA_DIVIDA}
      - {rotulo: ao ano, valor_interno: ANUAL, abre_campo: TAXA, variavel_do_campo: TAXA_DIVIDA}
      - {rotulo: Não sei a taxa, valor_interno: DESCONHECIDA, admite_nao_sei: true}
    VARIAVEL_GRAVADA: PERIODICIDADE_TAXA_DIVIDA
    indispensavel: true
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  # Grupo E — Situação (`B5.E01` e `B5.E02` saíram em `RF-511`)
  - ID: B5.E03
    bloco: 5
    enunciado: Esta dívida aparece atualmente em cadastro de inadimplência/negativação?
    tipo: SIM_NAO_TALVEZ
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
    VARIAVEL_GRAVADA: NEGATIVACAO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  - ID: B5.E05
    bloco: 5
    enunciado: Esta dívida tem processo ou cobrança judicial?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
    VARIAVEL_GRAVADA: COBRANCA_JUDICIAL_INFORMADA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "Não inferir consequências jurídicas."

  # Grupo F — Garantia
  - ID: B5.F01
    bloco: 5
    enunciado: Esta dívida está vinculada a algum bem ou garantia?
    tipo: SIM_NAO_TALVEZ
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
    VARIAVEL_GRAVADA: POSSUI_GARANTIA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "Sim → B5.F02 e B5.F03."

  - ID: B5.F02
    bloco: 5
    enunciado: Qual é a garantia?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Imóvel, valor_interno: IMOVEL}
      - {rotulo: Veículo, valor_interno: VEICULO}
      - {rotulo: Outro bem, valor_interno: OUTRO_BEM}
      - {rotulo: Aval/fiança, valor_interno: AVAL_FIANCA}
      - {rotulo: Saldo/aplicação financeira, valor_interno: SALDO_APLICACAO_FINANCEIRA}
      - {rotulo: Outra, valor_interno: OUTRA}
    VARIAVEL_GRAVADA: TIPO_GARANTIA
    condicao_exibicao: {tipo: IGUAL, variavel: POSSUI_GARANTIA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      Imóvel/Veículo → vincular à ficha do Bloco 4 correspondente
      (SALDO_PASSIVO_VINCULADO).

  - ID: B5.F03
    bloco: 5
    enunciado: >-
      Esse bem é essencial para sua moradia, trabalho, saúde ou rotina
      familiar?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "Sim.", valor_interno: ESSENCIAL}
      - {rotulo: "É importante, mas existem alternativas.", valor_interno: IMPORTANTE}
      - {rotulo: "Não.", valor_interno: NAO}
    VARIAVEL_GRAVADA: GARANTIA_ESSENCIAL
    condicao_exibicao: {tipo: IGUAL, variavel: POSSUI_GARANTIA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  # Grupo G — Oportunidades
  # Grupo H — Dimensão humana
  - ID: B5.H01
    bloco: 5
    enunciado: De 0 a 10, quanto esta dívida pesa emocionalmente para você hoje?
    tipo: ESCALA_0_10
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "0 = praticamente não me incomoda.", valor_interno: "0"}
      - {rotulo: "10 = é uma das dívidas que mais me preocupa ou desgasta.", valor_interno: "10"}
    VARIAVEL_GRAVADA: PESO_EMOCIONAL
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "≥ 4 → B5.H02."

  - ID: B5.H03
    bloco: 5
    enunciado: >-
      Na sua percepção, de 0 a 10, com que urgência esta dívida precisa ser
      resolvida?
    tipo: ESCALA_0_10
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "0 = pode esperar, sem urgência relevante", valor_interno: "0"}
      - {rotulo: "10 = máxima urgência para você", valor_interno: "10"}  # T-298
    VARIAVEL_GRAVADA: URGENCIA_PERCEBIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      Slider 0–10 com âncoras nas pontas. Não usar rótulos qualitativos.

  - ID: B5.H04
    bloco: 5
    enunciado: >-
      Se você pudesse eliminar apenas uma das suas dívidas primeiro, esta
      estaria entre suas primeiras escolhas?
    tipo: SIM_NAO_TALVEZ
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
    VARIAVEL_GRAVADA: PREFERENCIA_QUITACAO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "Bloco 9/10 (não decide sozinha)."

  # Fechamento da ficha e do inventário
  - ID: B5.FIM02
    bloco: 5
    enunciado: >-
      Pelo que você sabe hoje, todas as suas dívidas e operações
      financeiras foram cadastradas?
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: Sim. O inventário está completo., valor_interno: SIM}
      - {rotulo: Não. Ainda falta pelo menos uma dívida., valor_interno: NAO}
    VARIAVEL_GRAVADA: CONFIRMACAO_FIM_CADASTRO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      ≠ SIM → INVENTARIO_COMPLETO = falso → bloqueio global da Ordem
      Definitiva; diagnóstico parcial permitido. SYS:
      QUANTIDADE_DIVIDAS_CADASTRADA; QUANTIDADE_DIVIDAS_DECLARADA (final
      confirmada, separada da inicial).
