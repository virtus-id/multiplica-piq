# Bloco 5 — Inventário de dívidas. 58 perguntas, transcritas caractere por
# caractere da §11 da canônica (specs/piq-app-spec.md, linhas 2618-3473). T-17
# (RF-03, RF-04, RF-09, AC-04, AC-36). 55 das 58 perguntas são REP por
# DIVIDA_ID (cada dívida é uma ficha) — só B5.00, B5.00A e B5.FIM02 não são
# repetíveis (são perguntas de caso, não de ficha de dívida).
QUESTIONARIO_VERSION: "1.3.0"
perguntas:
  - ID: B5.00
    bloco: 5
    enunciado: >-
      Quantas dívidas ou operações financeiras diferentes você tem hoje?
    tipo: NUMERO
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "___ dívida(s)", valor_interno: null}
      - {rotulo: Não sei exatamente quantas., valor_interno: DESCONHECIDA, admite_nao_sei: true}
    VARIAVEL_GRAVADA: QUANTIDADE_DIVIDAS_DECLARADA_INICIAL
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Se desconhecida, preservar essa informação; a quantidade final
      confirmada é registrada separadamente em B5.FIM.

  # Grupo A — Identificação (ficha REP por dívida)
  - ID: B5.A01
    bloco: 5
    enunciado: Para quem você deve nessa operação?
    tipo: TEXTO_CURTO
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes: []
    VARIAVEL_GRAVADA: CREDOR
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  - ID: B5.A02
    bloco: 5
    enunciado: Que tipo de dívida é esta?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Empréstimo consignado, valor_interno: CONSIGNADO}
      - {rotulo: Empréstimo pessoal, valor_interno: PESSOAL}
      - {rotulo: Financiamento de veículo, valor_interno: FIN_VEICULO}
      - {rotulo: Financiamento imobiliário, valor_interno: FIN_IMOBILIARIO}
      - {rotulo: Cartão de crédito — saldo rotativo, valor_interno: CARTAO_ROTATIVO}
      - {rotulo: Cartão de crédito — parcelamento de fatura, valor_interno: CARTAO_PARCELADO}
      - {rotulo: Cheque especial, valor_interno: CHEQUE_ESPECIAL}
      - {rotulo: Parcelamento de compra, valor_interno: PARCELAMENTO_COMPRA}
      - {rotulo: Dívida tributária, valor_interno: TRIBUTARIA}
      - {rotulo: Dívida com familiar ou outra pessoa, valor_interno: PESSOA_FISICA}
      - {rotulo: Acordo ou renegociação, valor_interno: ACORDO}
      - {rotulo: Outra, valor_interno: OUTRA}
    VARIAVEL_GRAVADA: TIPO_DIVIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      Define modelo da engine, exibição de B5.C07 (linhas reutilizáveis) e
      de B5.G03 (modalidades portáveis).

  # RF-90, AC-139 (parte CONSIGNADO), DE-05, canônica v1.0.2 E-09 — T-256.
  # Nome técnico a critério do plano (OQ-59); enunciado: aprovado pelo
  # produto (T-289, 2026-09-30). Cartão consignado/benefício NÃO entra
  # nesta rodada (decisão do produto R9-4, 2026-09-30 — T-279).
  - ID: B5.A02V
    bloco: 5
    enunciado: Em qual vínculo esta dívida é descontada?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes: []
    VARIAVEL_GRAVADA: VINCULO_DA_DIVIDA
    condicao_exibicao: {tipo: IGUAL, variavel: TIPO_DIVIDA, valor: CONSIGNADO}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes:
      fonte: ITENS_DO_ESCOPO
      campo_do_snapshot: null
      escopo: VINCULO_ID
      variavel_rotulo: ORGAO_FONTE_PAGADORA
    admite_nao_sei: false
    salto_consequencia: >-
      SYS: a dívida consignada aponta o VINCULO_ID em que é descontada;
      opções = vínculos ativos do caso.

  - ID: B5.A04
    bloco: 5
    enunciado: Qual destas opções descreve melhor esta operação hoje?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Está ativa., valor_interno: ATIVA}
      - {rotulo: Está em acordo ou renegociação., valor_interno: EM_ACORDO}
      - {rotulo: "Está sendo cobrada, mas não possui pagamento regular definido.", valor_interno: COBRANCA_SEM_PAGAMENTO}
      - {rotulo: "Acredito que esteja quitada, mas preciso confirmar.", valor_interno: QUITADA_A_CONFIRMAR}
      - {rotulo: Outra situação., valor_interno: OUTRA}
    VARIAVEL_GRAVADA: STATUS_DIVIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      QUITADA_A_CONFIRMAR → ação de confirmação (Bloco 11); não entra em
      DIVIDA_TOTAL até confirmar.

  # Grupo B — Valores e saldo
  - ID: B5.B03
    bloco: 5
    enunciado: Qual é o saldo devedor atual desta dívida?
    tipo: MOEDA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: SALDO_DEVEDOR_ATUAL
    indispensavel: true  # RF-93 (`T-261`, `R9-8`)
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      DESCONHECIDA → PRIORIDADE DE INFORMAÇÃO; STATUS_DIVIDA_TOTAL =
      PARCIAL.

  - ID: B5.B05
    bloco: 5
    enunciado: >-
      Você já consultou quanto precisaria pagar hoje para quitar
      integralmente esta dívida?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "Sim.", valor_interno: SIM}
      - {rotulo: "Não.", valor_interno: NAO}
      - {rotulo: "Consultei, mas o valor já venceu/expirou.", valor_interno: EXPIROU}
      - {rotulo: Não sei., valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: QUITACAO_CONSULTADA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      SIM → B5.B05A e B5.B05B. EXPIROU → B5.B05A como histórico
      (STATUS_VALIDADE_PROPOSTA = EXPIRADA). NAO → ação de consulta (Bloco
      11).

  - ID: B5.B05A
    bloco: 5
    enunciado: Qual foi o valor informado para quitar a dívida?
    tipo: MOEDA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: VALOR_QUITACAO_HOJE
    condicao_exibicao:
      tipo: OU
      termos:
        - {tipo: IGUAL, variavel: QUITACAO_CONSULTADA, valor: SIM}
        - {tipo: IGUAL, variavel: QUITACAO_CONSULTADA, valor: EXPIROU}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "Saldo devedor ≠ valor de quitação."

  - ID: B5.B05B
    bloco: 5
    enunciado: Até quando esse valor é válido?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Data, valor_interno: null, abre_campo: DATA}
      - {rotulo: Validade não informada., valor_interno: VALIDADE_DESCONHECIDA}
      - {rotulo: Não sei., valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: DATA_VALIDADE_PROPOSTA
    condicao_exibicao: {tipo: IGUAL, variavel: QUITACAO_CONSULTADA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Validade desconhecida e material → PRIORIDADE DE INFORMAÇÃO.

  # Grupo C — Fluxo
  - ID: B5.C01
    bloco: 5
    enunciado: >-
      Esta dívida possui uma parcela ou prestação mensal definida
      atualmente?
    tipo: SIM_NAO_TALVEZ
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
      - {rotulo: Não sei, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: POSSUI_PARCELA_DEFINIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Sim → B5.C02–C04 (Modelo 1). Não/Não sei → B5.C05 (Modelo 2).

  - ID: B5.C02
    bloco: 5
    enunciado: Qual é o valor da parcela ou prestação que deveria ser paga atualmente?
    tipo: MOEDA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: "PARCELA_CONTRATUAL (= PAGAMENTO_MENSAL_DEVIDO_VIGENTE)"
    indispensavel: true  # RF-93 (`T-261`, `R9-8`)
    condicao_exibicao: {tipo: IGUAL, variavel: POSSUI_PARCELA_DEFINIDA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B5.C06
    bloco: 5
    enunciado: Na prática, quanto você está pagando por mês nesta dívida atualmente?
    tipo: MOEDA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Não estou pagando nada atualmente., valor_interno: "0"}
      - {rotulo: O valor varia muito., valor_interno: VARIA}
      - {rotulo: Não sei., valor_interno: DESCONHECIDA, admite_nao_sei: true}
    VARIAVEL_GRAVADA: PAGAMENTO_MENSAL_EFETIVO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "VARIA → B5.C06A."

  - ID: B5.C06A
    bloco: 5
    enunciado: >-
      Qual foi a média mensal paga nos últimos 3 meses, conforme o extrato?
    tipo: MOEDA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: "PAGAMENTO_MENSAL_EFETIVO (média 3 meses)"
    condicao_exibicao: {tipo: IGUAL, variavel: PAGAMENTO_MENSAL_EFETIVO, valor: VARIA}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B5.C07
    bloco: 5
    enunciado: >-
      Mesmo enquanto paga essa dívida, você continua usando esse limite ou
      linha de crédito?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "Sim, com frequência.", valor_interno: SIM}
      - {rotulo: Às vezes., valor_interno: AS_VEZES}
      - {rotulo: "Não.", valor_interno: NAO}
      - {rotulo: Não se aplica., valor_interno: NAO_APLICA}
    VARIAVEL_GRAVADA: LINHA_CONTINUA_SENDO_UTILIZADA
    condicao_exibicao:
      tipo: OU
      termos:
        - {tipo: IGUAL, variavel: TIPO_DIVIDA, valor: CARTAO_ROTATIVO}
        - {tipo: IGUAL, variavel: TIPO_DIVIDA, valor: CHEQUE_ESPECIAL}
        - {tipo: IGUAL, variavel: TIPO_DIVIDA, valor: CARTAO_PARCELADO}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "SIM/AS_VEZES → B5.C07A."

  # Grupo D — Custo
  # `T-393` (RF-407): um só valor de custo da dívida, CET ou taxa de juros,
  # sem marca de qual foi informado. Substitui `B5.D01`, `B5.D01A`, `B5.D01B`,
  # `B5.D03` e `B5.D03A`. Valor e periodicidade na mesma resposta: o código da
  # opção (ao mês / ao ano) vai em `PERIODICIDADE_TAXA_DIVIDA` e o percentual
  # digitado, em `TAXA_DIVIDA` (mecanismo `abre_campo` + `variavel_do_campo`).
  # `OBR` + `REP`: sem o valor, o cálculo não libera (`pendencias_obrigatorias`).
  - ID: B5.D06
    bloco: 5
    enunciado: >-
      Qual é o Custo Efetivo Total (CET) desta operação? Se não souber, informe
      a taxa de juros. (No seu contrato, extrato ou aplicativo do banco, esse
      número pode aparecer escrito como CET ou como taxa de juros. Informe o
      que encontrar e diga se é ao mês ou ao ano.)
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: ao mês, valor_interno: MENSAL, abre_campo: TAXA, variavel_do_campo: TAXA_DIVIDA}
      - {rotulo: ao ano, valor_interno: ANUAL, abre_campo: TAXA, variavel_do_campo: TAXA_DIVIDA}
    VARIAVEL_GRAVADA: PERIODICIDADE_TAXA_DIVIDA
    indispensavel: true
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  # Grupo E — Situação
  - ID: B5.E01
    bloco: 5
    enunciado: Como está o pagamento desta dívida hoje?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Está em dia., valor_interno: EM_DIA}
      - {rotulo: Existe parcela/valor vencido., valor_interno: VENCIDO}
      - {rotulo: Estou pagando parcialmente., valor_interno: PARCIAL}
      - {rotulo: Não existe pagamento regular definido atualmente., valor_interno: SEM_PAGAMENTO_REGULAR}
    VARIAVEL_GRAVADA: "DIVIDA_EM_DIA / DIVIDA_ATRASADA"
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "VENCIDO/PARCIAL → B5.E02."

  - ID: B5.E02
    bloco: 5
    enunciado: Há quanto tempo existe valor vencido?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Menos de 30 dias, valor_interno: MENOS_DE_30_DIAS}
      - {rotulo: 1–3 meses, valor_interno: "1_3M"}
      - {rotulo: 4–6 meses, valor_interno: "4_6M"}
      - {rotulo: 7–12 meses, valor_interno: "7_12M"}
      - {rotulo: Mais de 12 meses, valor_interno: MAIS_DE_12_MESES}
      - {rotulo: Não sei, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: TEMPO_ATRASO
    condicao_exibicao:
      tipo: OU
      termos:
        - {tipo: IGUAL, variavel: "DIVIDA_EM_DIA / DIVIDA_ATRASADA", valor: VENCIDO}
        - {tipo: IGUAL, variavel: "DIVIDA_EM_DIA / DIVIDA_ATRASADA", valor: PARCIAL}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B5.E03
    bloco: 5
    enunciado: Esta dívida aparece atualmente em cadastro de inadimplência/negativação?
    tipo: SIM_NAO_TALVEZ
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
      - {rotulo: Não sei, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: NEGATIVACAO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B5.E05
    bloco: 5
    enunciado: Esta dívida tem processo ou cobrança judicial?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
    VARIAVEL_GRAVADA: COBRANCA_JUDICIAL_INFORMADA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "Não inferir consequências jurídicas."

  # Grupo F — Garantia
  - ID: B5.F01
    bloco: 5
    enunciado: Esta dívida está vinculada a algum bem ou garantia?
    tipo: SIM_NAO_TALVEZ
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
      - {rotulo: Não sei, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: POSSUI_GARANTIA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "Sim → B5.F02 e B5.F03."

  - ID: B5.F02
    bloco: 5
    enunciado: Qual é a garantia?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Imóvel, valor_interno: IMOVEL}
      - {rotulo: Veículo, valor_interno: VEICULO}
      - {rotulo: Outro bem, valor_interno: OUTRO_BEM}
      - {rotulo: Aval/fiança, valor_interno: AVAL_FIANCA}
      - {rotulo: Saldo/aplicação financeira, valor_interno: SALDO_APLICACAO_FINANCEIRA}
      - {rotulo: Outra, valor_interno: OUTRA}
      - {rotulo: Não sei, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: TIPO_GARANTIA
    condicao_exibicao: {tipo: IGUAL, variavel: POSSUI_GARANTIA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Imóvel/Veículo → vincular à ficha do Bloco 4 correspondente
      (SALDO_PASSIVO_VINCULADO).

  - ID: B5.F03
    bloco: 5
    enunciado: >-
      Esse bem é essencial para sua moradia, trabalho, saúde ou rotina
      familiar?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "Sim.", valor_interno: ESSENCIAL}
      - {rotulo: "É importante, mas existem alternativas.", valor_interno: IMPORTANTE}
      - {rotulo: "Não.", valor_interno: NAO}
      - {rotulo: Não sei., valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: GARANTIA_ESSENCIAL
    condicao_exibicao: {tipo: IGUAL, variavel: POSSUI_GARANTIA, valor: SIM}
    interpolacoes: []
