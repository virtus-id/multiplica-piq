# Bloco 1 — Pacto da Virada. 16 perguntas, transcritas caractere por caractere
# da §11 da canônica (specs/piq-app-spec.md, linhas 550-801). T-17 (RF-03,
# RF-04, RF-09, AC-04, AC-36).
QUESTIONARIO_VERSION: "1.3.0"
perguntas:
  - ID: B1.01
    bloco: 1
    enunciado: >-
      Para executar este plano, qual destas frases melhor representa sua
      situação hoje?
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - rotulo: >-
          Estou disposto(a) a não assumir novas dívidas ou parcelamentos
          enquanto estiver executando o PIQ, salvo alguma operação de
          renegociação ou troca que faça parte do próprio plano.
        valor_interno: ESTABELECIDO
      - rotulo: >-
          Quero assumir esse compromisso, mas hoje ainda existe o risco de eu
          precisar recorrer a crédito ou parcelamento.
        valor_interno: EM_CONSTRUCAO
      - rotulo: Neste momento, ainda não consigo assumir esse compromisso.
        valor_interno: NAO_ESTABELECIDO
    VARIAVEL_GRAVADA: PACTO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "NAO_ESTABELECIDO não bloqueia o PIQ."

  - ID: B1.07
    bloco: 1
    enunciado: >-
      Você já pretende fazer alguma nova compra parcelada nos próximos
      meses?
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "Sim.", valor_interno: SIM}
      - {rotulo: "Talvez.", valor_interno: TALVEZ}
      - {rotulo: "Não.", valor_interno: NAO}
    VARIAVEL_GRAVADA: NOVO_PARCELAMENTO_PREVISTO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  - ID: B1.09
    bloco: 1
    enunciado: >-
      Quando o dinheiro do mês não é suficiente, o que você costuma fazer?
    tipo: SELECAO_MULTIPLA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: Corto ou adio algum gasto., valor_interno: CORTE}
      - {rotulo: Uso dinheiro da reserva., valor_interno: RESERVA}
      - {rotulo: Uso cartão de crédito., valor_interno: CARTAO}
      - {rotulo: Entro no cheque especial., valor_interno: CHEQUE_ESPECIAL}
      - {rotulo: Faço empréstimo ou uso crédito pré-aprovado., valor_interno: EMPRESTIMO}
      - {rotulo: Parcelo contas ou compras para caber no mês., valor_interno: PARCELAMENTO}
      - {rotulo: Atraso alguma conta ou dívida., valor_interno: ATRASO}
      - {rotulo: Peço ajuda financeira a familiar ou outra pessoa., valor_interno: TERCEIRO}
      - {rotulo: Busco renda extra ou vendo alguma coisa., valor_interno: RENDA_EXTRA}
      - {rotulo: Isso normalmente não acontece comigo., valor_interno: NAO_OCORRE}
      - {rotulo: Outra situação., valor_interno: OUTRA}
    VARIAVEL_GRAVADA: MECANISMO_DEFICIT
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      "Outra situação" → texto curto OPT. "Isso normalmente não acontece
      comigo" é exclusiva.
