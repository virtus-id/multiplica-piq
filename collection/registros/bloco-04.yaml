# Bloco 4 — Vínculos, margens e patrimônio. 49 perguntas, transcritas
# caractere por caractere da §11 da canônica (specs/piq-app-spec.md, linhas
# 1903-2614). T-17 (RF-03, RF-04, RF-09, AC-04, AC-36).
QUESTIONARIO_VERSION: "1.3.0"
perguntas:
  - ID: B4.01
    bloco: 4
    enunciado: >-
      Hoje, fora da sua reserva financeira e dos seus investimentos, você
      possui algum dinheiro disponível que não esteja comprometido com as
      despesas normais até a próxima entrada de renda?
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
      - {rotulo: Não sei ao certo, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: DINHEIRO_DISPONIVEL_EXISTE
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "Sim → B4.01A."

  - ID: B4.01A
    bloco: 4
    enunciado: Quanto aproximadamente?
    tipo: MOEDA
    obrigatoriedade: [COND]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
    VARIAVEL_GRAVADA: DINHEIRO_DISPONIVEL
    condicao_exibicao: {tipo: IGUAL, variavel: DINHEIRO_DISPONIVEL_EXISTE, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  - ID: B4.02
    bloco: 4
    enunciado: >-
      Você possui hoje alguma reserva financeira separada para emergências,
      imprevistos ou proteção do orçamento?
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "Sim.", valor_interno: SIM}
      - rotulo: >-
          Tenho algum dinheiro guardado, mas não considero uma reserva
          estruturada.
        valor_interno: INFORMAL
      - {rotulo: "Não.", valor_interno: NAO}
    VARIAVEL_GRAVADA: RESERVA_EXISTE
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "SIM ou INFORMAL → B4.02A, B4.02B, B4.03."

  - ID: B4.02A
    bloco: 4
    enunciado: >-
      Qual é o valor total que você considera hoje como reserva ou dinheiro
      guardado para proteção?
    tipo: MOEDA
    obrigatoriedade: [COND]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: RESERVA_TOTAL
    condicao_exibicao:
      tipo: NAO
      termo: {tipo: IGUAL, variavel: RESERVA_EXISTE, valor: NAO}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B4.03
    bloco: 4
    enunciado: >-
      Se a análise mostrar que usar uma parte da reserva pode ser
      financeiramente vantajoso sem deixar você desprotegido, você
      aceitaria considerar essa possibilidade?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "Sim, aceitaria avaliar o uso de uma parte.", valor_interno: PARTE}
      - rotulo: >-
          Sim, aceitaria avaliar até mesmo o uso de grande parte da
          reserva.
        valor_interno: GRANDE_PARTE
      - {rotulo: Talvez. Quero ver os números antes., valor_interno: TALVEZ}
      - {rotulo: Não. Prefiro preservar integralmente minha reserva., valor_interno: NAO}
    VARIAVEL_GRAVADA: DISPOSICAO_USO_RESERVA
    condicao_exibicao:
      tipo: NAO
      termo: {tipo: IGUAL, variavel: RESERVA_EXISTE, valor: NAO}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "≠ NAO → B4.03A."

  - ID: B4.03A
    bloco: 4
    enunciado: >-
      Qual é o valor máximo da sua reserva que você aceitaria colocar em
      análise para uma possível quitação?
    tipo: MOEDA
    obrigatoriedade: [COND]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      # T-296: códigos sem efeito no cálculo — a montagem lê os dois como
      # DESCONHECIDO; distingui-los é OQ-22(a), decisão do especialista.
      - {rotulo: Prefiro decidir somente depois de ver a análise., valor_interno: DECIDIR_DEPOIS}
      - {rotulo: Não sei., valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: VALOR_MAXIMO_RESERVA_INFORMADO_USUARIO
    condicao_exibicao:
      tipo: NAO
      termo: {tipo: IGUAL, variavel: DISPOSICAO_USO_RESERVA, valor: NAO}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "Valor para análise. Não é recomendação automática."

